<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高一英语课程讲解</title>
<style>
:root{
  --g:#2F6FE4; --g-d:#1B4CA8; --g-l:#E9F1FE; --g-2:#CFE0FC;
  --ink:#152C4A; --ink2:#44618A; --mut:#8AA0BE;
  --bg:#EDF4FC; --card:#fff; --line:#E3EAF6; --line2:#EFF4FC;
  --sand:#FBF1DC; --sand-d:#B08A3E;
  --hand:"STKaiti","KaiTi","楷体",cursive;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --fs:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
body{
  font-family:var(--sans); color:var(--ink); line-height:1.65;
  background:linear-gradient(150deg,#E7EFFB 0%,#F8FBFF 38%,#E3EDFA 78%,#EBF3FD 100%);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(600px 320px at 88% 8%, rgba(150,185,240,.30), transparent 70%),
    radial-gradient(700px 400px at 4% 92%, rgba(170,200,245,.30), transparent 72%);
}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ================= layout ================= */
.app{position:relative;z-index:1;display:flex;min-height:100vh;max-width:1440px;margin:0 auto}
.side{
  width:214px;flex:0 0 214px;height:100vh;position:sticky;top:0;
  background:rgba(255,255,255,.62);backdrop-filter:blur(8px);
  border-right:1px solid rgba(214,232,222,.9);
  padding:22px 12px 16px;display:flex;flex-direction:column;gap:6px;
}
.brand{padding:0 8px 20px}
.brand .t{font-size:15px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.brand .t svg{width:13px;height:13px;stroke-width:2;color:var(--mut)}
.brand .e{font-family:Georgia,serif;font-size:12px;color:var(--mut);letter-spacing:.4px;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav .item,.side .foot .item{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:10px;
  color:#4E6489;font-size:13.5px;text-align:left;transition:.16s;
}
.nav .item svg,.side .foot .item svg{width:16px;height:16px;opacity:.72;flex:0 0 16px}
.nav .item:hover,.side .foot .item:hover{background:rgba(233,241,254,.85)}
.nav .item.on,.side .foot .item.on{background:var(--g-l);color:var(--g-d);font-weight:700}
.nav .item.on svg,.side .foot .item.on svg{opacity:1}
.nav .cnt{margin-left:auto;font-size:10.5px;background:var(--g);color:#fff;border-radius:9px;padding:1px 6px;line-height:1.5;font-style:normal}
.side .foot{border-top:1px solid var(--line);padding-top:8px}

.main{flex:1;min-width:0;padding:16px 34px 64px;display:flex;flex-direction:column}

/* ================= topbar ================= */
.topbar{display:flex;align-items:center;gap:12px;padding:8px 2px 18px}
.dots{display:flex;gap:5px;margin-right:2px}
.dots i{width:8px;height:8px;border-radius:50%;background:#F0B7B0}
.dots i:nth-child(2){background:#F2D9A0}
.dots i:nth-child(3){background:#B9DCC4}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--g);color:#fff;font-size:12px;padding:4px 11px;border-radius:8px;font-weight:600;white-space:nowrap}
.searchbar{
  flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--mut);font-size:12.5px;
}
.searchbar input{border:0;outline:0;background:none;width:100%;font-size:12.5px;color:var(--ink)}
.iconbtn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#7A9086}
.iconbtn:hover{background:var(--g-l);color:var(--g-d)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.who .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(140deg,#9DBCF0,#3C74DC);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}

/* ================= common ================= */
h1.pt{font-size:21px;letter-spacing:.2px;font-weight:700}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:8px 15px;font-size:13px;font-weight:600;transition:.16s}
.btn svg{width:15px;height:15px}
.btn-g{background:var(--g);color:#fff;box-shadow:0 6px 16px rgba(47,111,228,.22)}
.btn-g:hover{background:#2762D0}
.btn-o{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn-o:hover{border-color:var(--g-2);color:var(--g-d)}
.btn-soft{background:var(--g-l);color:var(--g-d)}
.btn-soft:hover{background:var(--g-2)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 14px;font-size:12.5px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.pill.on{background:var(--g-l);border-color:var(--g-2);color:var(--g-d);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(40,80,150,.04)}
.sect-t{font-size:14.5px;font-weight:700;margin:2px 0 10px}

/* ================= 我的讲评 ================= */
.exams-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px}
.exam-tools{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tool-input{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 12px;width:230px;color:var(--mut)}
.tool-input input{border:0;outline:0;background:none;width:100%;font-size:12.5px}
.mini{font-size:12px;color:var(--ink2);padding:6px 9px;border-radius:8px;display:inline-flex;gap:5px;align-items:center}
.mini:hover{background:var(--g-l);color:var(--g-d)}
.mini svg{width:13px;height:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.exam{padding:16px 16px 12px;position:relative;cursor:pointer;transition:.18s;border-radius:14px}
.exam:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(40,80,150,.10);border-color:var(--g-2)}
.exam .chk{position:absolute;left:14px;top:14px;width:15px;height:15px;border:1px solid #C6D6EE;border-radius:4px;display:grid;place-items:center;background:#fff}
.exam .chk.on{background:var(--g);border-color:var(--g)}
.exam .chk.on::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.exam .tt{font-size:14px;font-weight:700;margin:26px 0 4px;line-height:1.45}
.exam .meta{font-size:11.5px;color:var(--mut);margin-top:2px}
.exam .foot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.chip-bk{background:var(--sand);color:var(--sand-d);font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:700}
.exam .foot .dt{margin-left:auto;font-size:11px;color:#AFC0B8;font-variant-numeric:tabular-nums}

/* ================= 阅读精讲 ================= */
.read-wrap{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:start}
.unitlist{padding:10px;display:flex;flex-direction:column;gap:3px;position:sticky;top:16px}
.unitlist .bk{font-size:10.5px;color:var(--mut);letter-spacing:.6px;padding:8px 8px 4px;font-weight:700}
.unitlist button{text-align:left;padding:8px 9px;border-radius:8px;font-size:12.5px;color:var(--ink2);display:flex;gap:7px;align-items:center}
.unitlist button:hover{background:var(--g-l)}
.unitlist button.on{background:var(--g-l);color:var(--g-d);font-weight:700}
.reader{padding:26px 30px 30px}
.reader .kicker{font-family:var(--hand);font-size:23px;color:var(--g-d);letter-spacing:.5px}
.reader h2{font-size:19px;margin:4px 0 6px}
.reader .meta2{font-size:12px;color:var(--mut);margin-bottom:18px}
.passage{font-family:Georgia,"Times New Roman",serif;font-size:16.5px;line-height:2.05;color:#1D3557;letter-spacing:.2px}
.passage p+p{margin-top:14px}
.wd{color:var(--g-d);border-bottom:1.5px solid var(--g-2);cursor:pointer;padding-bottom:1px;transition:.15s}
.wd:hover{background:var(--g-l);border-color:var(--g)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tags .w{background:#F7FAFE;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.tags .w:hover{border-color:var(--g-2);background:var(--g-l)}
.tags .w b{font-weight:700;margin-right:5px}
.tags .w span{color:var(--mut);font-size:11.5px}
.reader .foot{display:flex;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line2)}

/* ================= 词典 ================= */
.dict-head{margin-bottom:18px}
.dict-head .kicker{font-family:var(--hand);font-size:24px;color:var(--g-d);line-height:1.3}
.dict-head h1{font-family:var(--hand);font-size:33px;margin:2px 0 4px;letter-spacing:.5px;font-weight:400;color:var(--ink)}
.dict-head .sub2{font-size:12.5px;color:var(--mut)}
.bigsearch{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 16px;margin:18px 0 20px;box-shadow:0 4px 16px rgba(40,80,150,.05)}
.bigsearch input{flex:1;border:0;outline:0;background:none;font-size:14px}
.wall{display:flex;flex-wrap:wrap;gap:11px;align-items:flex-start}
.wcard{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:120px;
  cursor:pointer;transition:.18s;
}
.wcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(40,80,150,.10);border-color:var(--g-2)}
.wcard .w{font-weight:700;font-size:14px;letter-spacing:.2px}
.wcard .d{font-size:11.5px;color:var(--mut);margin-top:2px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard.hl{background:var(--g-l);border-color:var(--g-2)}
.wcard.hl .d{color:#4E7568}
.wcard.big{padding:14px 18px}
.wcard.big .w{font-size:17px}
.wall-foot{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}

/* ================= 词汇训练 ================= */
.train-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 8px;text-align:center}
.stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.stat.a .n{color:#DD8B3E}
.stat.b .n{color:var(--g-d)}
.stat.c .n{color:#7FA0C6}
.cta-row{display:flex;justify-content:center;margin:6px 0 26px}
.cta{background:var(--g);color:#fff;font-size:14.5px;font-weight:700;padding:12px 40px;border-radius:999px;box-shadow:0 10px 24px rgba(47,111,228,.26);display:inline-flex;gap:9px;align-items:center}
.cta:hover{background:#2762D0}
.cta:disabled{background:#CFDED7;box-shadow:none;cursor:not-allowed}
table.wt{width:100%;border-collapse:collapse}
table.wt th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;padding:0 12px 9px;border-bottom:1px solid var(--line)}
table.wt th:nth-child(1){width:26%}
table.wt th:nth-child(3){width:120px;text-align:right}
table.wt td{padding:11px 12px;border-bottom:1px solid var(--line2);font-size:13.5px;vertical-align:top}
table.wt tr:hover td{background:#F7FAFE}
table.wt td.w{font-weight:700;letter-spacing:.2px;cursor:pointer}
table.wt td.m{color:var(--ink2);font-size:12.5px;line-height:1.6}
table.wt td.op{text-align:right;white-space:nowrap}
.lv{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:#93A79E;background:#fff;font-variant-numeric:tabular-nums;cursor:pointer}
.lv.l1{background:var(--g-l);border-color:var(--g-2);color:var(--g-d)}
.lv.l2{background:var(--g);border-color:var(--g);color:#fff}
.lv.l3{background:var(--sand);border-color:#F0E0BE;color:var(--sand-d)}
.lv.todo{background:#FDF3E4;border-color:#F3E2C6;color:#C08B41}
.empty{padding:46px;text-align:center;color:var(--mut);font-size:13px}

/* ================= 单词漂流 ================= */
.drift-stage{position:relative;height:min(64vh,560px);overflow:hidden;border-radius:16px;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.92),rgba(240,246,255,.65) 60%,rgba(226,237,252,.8));border:1px solid var(--line)}
.drift-stage .chip{position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 4px 12px rgba(40,80,150,.07);cursor:pointer;opacity:0}
@keyframes drift-up{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(calc(-1 * var(--rise,520px))) translateX(22px);opacity:0}}
.drift-tip{font-size:12px;color:var(--mut)}
.drift-card{padding:30px;text-align:center;max-width:560px;margin:0 auto;position:absolute;inset:0}
.drift-card .big{font-size:32px;font-weight:700;letter-spacing:.5px;margin-top:24%}
.drift-card .dfn{font-size:14px;color:var(--ink2);margin-top:12px;min-height:24px}

/* ================= 设置 ================= */
.set-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.set-block{padding:18px 20px}
.set-block h4{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.set-block h4 i{width:5px;height:14px;border-radius:3px;background:var(--g);display:inline-block}
.set-line{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.set-line:last-child{border-bottom:0}
.set-line .k{width:88px;flex:0 0 88px;color:var(--ink2)}
.set-line .v{flex:1;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:12.5px;flex-wrap:wrap}
.set-line select,.set-line input[type=text]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;background:#fff;outline:0;min-width:110px}
.set-line input[type=text]{flex:1;min-width:0}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:3px;background:var(--g-2);flex:1;min-width:90px;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--g);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.num{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink2);min-width:42px;text-align:right}
.fsbtn{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12px;color:var(--ink2)}
.fsbtn:hover{border-color:var(--g-2);color:var(--g-d)}
.radio{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.radio input{accent-color:var(--g)}

/* ================= modal / toast ================= */
.mask{position:fixed;inset:0;background:rgba(16,38,72,.38);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px}
.sheet{background:#fff;border-radius:18px;width:min(560px,94vw);padding:20px 24px 22px;box-shadow:0 24px 60px rgba(16,40,80,.26);position:relative}
.sheet .x{position:absolute;right:14px;top:10px;color:var(--mut);font-size:22px;line-height:1;padding:4px}
.sheet h3{font-size:15px;margin-bottom:2px}
.sheet .sm{font-size:11.5px;color:var(--mut)}
.flash{margin:26px 0 8px;text-align:center}
.flash .w{font-size:38px;font-weight:700;letter-spacing:.6px;line-height:1.2}
.flash .d{font-size:15px;color:var(--ink2);margin-top:12px;min-height:22px;line-height:1.7;padding:0 10px}
.flash .tip{font-size:11.5px;color:#B9C8C1;margin-top:10px}
.ansrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.ansrow button{padding:10px 4px;border-radius:10px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.ansrow button:hover{border-color:var(--g-2);background:var(--g-l);color:var(--g-d)}
.spell-in{display:block;width:100%;max-width:340px;margin:16px auto 0;text-align:center;font-size:21px;letter-spacing:2px;
  padding:10px 14px;border:1.5px solid var(--g-2);border-radius:12px;outline:0;background:#fff;font-weight:600;transition:.16s}
.spell-in:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(47,111,228,.13)}
.spell-in.ok{border-color:#3BA55D;color:#2E7D45;background:#F1FAF4}
.spell-in.bad{border-color:#D9614C;color:#B8442F;background:#FDF3F1}
.spell-fb{font-size:12.5px;margin-top:10px;min-height:20px;color:var(--ink2)}
.spell-fb b{font-weight:700}
.spell-meta{font-size:11.5px;color:var(--mut);margin-top:4px}
.prog{height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:16px}.prog i{display:block;height:100%;background:var(--g);transition:.3s}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(14px);background:rgba(24,45,74,.94);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.ocr-cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;align-items:start}
.ocr-pic{border:1px solid var(--line);border-radius:10px;background:#F7FAFE;padding:6px;max-height:340px;overflow:auto}
.ocr-pic img{width:100%;display:block;border-radius:6px;cursor:zoom-in}
.ocr-pic.big{position:fixed;inset:12px;max-height:none;z-index:80;background:#fff;box-shadow:0 20px 60px rgba(20,40,80,.35);overflow:auto}
.ocr-pic.big img{cursor:zoom-out;width:auto;max-width:100%;margin:0 auto}
.ocr-warn{margin-top:12px;padding:9px 12px;border-radius:9px;background:#FFF6E6;border:1px solid #F3D9A8;color:#8A5B12;font-size:12px;line-height:1.7}
.paste-tip{margin:-6px 0 14px;font-size:12px;color:var(--mut)}
.paste-tip b{color:var(--g);font-weight:700}
@media(max-width:820px){.ocr-cmp{grid-template-columns:1fr}.ocr-pic{max-height:200px}}
body.drag-over::after{content:'松开即导入';position:fixed;inset:0;background:rgba(47,111,228,.12);border:3px dashed var(--g);z-index:95;display:grid;place-items:center;font-size:20px;color:var(--g-d);font-weight:700;pointer-events:none}

/* ---------- 题库批改 ---------- */
.qb-stat{font-size:13px;color:var(--ink2);margin:2px 0 12px}
.qb-stat b{color:var(--ink)}
.qb-stat b.good{color:#2E7D45}.qb-stat b.mid{color:#C77700}.qb-stat b.bad{color:#B8442F}
.qb-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.qb-chip{border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:12.5px;padding:6px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.qb-chip:hover{border-color:var(--g-2)}
.qb-chip.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.qb-card{padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.qb-head{display:flex;align-items:center;gap:8px}
.qb-tag{font-size:11px;font-weight:700;color:var(--g-d);background:var(--g-l);border-radius:6px;padding:3px 8px}
.qb-acc{margin-left:auto;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
.qb-acc.none{background:#F1F5FB;color:var(--mut);font-weight:600}
.qb-acc.good{background:#E7F5EB;color:#2E7D45}
.qb-acc.mid{background:#FFF4E0;color:#C77700}

const PASSAGES = {
 'b1-WU':{t:'My First Week at Senior High',p:`I still remember my first week at senior high. Everything felt new: the campus, the classrooms, and all the girls and boys in my class. At the opening lecture our head teacher asked us to introduce ourselves. I was anxious and a little awkward, so my voice was very low. But a boy smiled at me and said, "Don't worry. Just be confident." We soon became partners in a science experiment. Now I have a clear goal: to improve my English and make a good impression on my teachers. I look forward to every day here.`},
 'b1-U1':{t:'The Ballet Club',p:`I am a freshman at senior high school, and my life is busier than I expected. I signed up for the ballet club because I love dancing, but I also joined the debate club by accident. Now I have to keep a balance. My adviser recommends that I make a schedule and focus on one thing at a time. "You are responsible for your own choices," she said. That is a real challenge. But I am determined: I will be a fluent speaker and a good student, and I will not quit halfway.`},
 'b1-U2':{t:'A Trip to Peru',p:`Next month my family is travelling to Peru. We are taking a flight to Cusco and then a train to Machu Picchu. My father has booked the accommodation and rented a car, though he still needs to apply for a visa. I have packed a brochure and a map, and I keep reading about the Inca Empire. The ancient site is unique: stone walls, narrow paths and an amazing view. I am extremely excited. I only hope the weather stays calm and our flights are on time.`},
 'b1-U3':{t:'My First Marathon',p:`Last year I was slim but weak, so I started to jog every morning. Now and then my friend invites me to the gym, where we work out together. He is a legend in our school, the captain of the track and field team, and he has set an example for me. "Don't lose heart," he says. "Strength comes from practice." His positive attitude made a difference. In May I finished my first marathon, and the medal on my desk reminds me that even a small effort can change a life.`},
 'b1-U4':{t:'The Night the Earth Shook',p:`At 3:42 in the morning the earthquake struck. In less than a minute the city lay in ruins: brick walls had fallen and the electricity was cut off. People were trapped under metal roofs, and the survivors had to breathe through the dust. But help arrived quickly. Soldiers and volunteers came to rescue them, and helicopters brought supplies. A dam was damaged and a landslide blocked the road, yet nobody gave up. In the open air we shared blankets and water. That night I learned what courage means.`},
 'b1-U5':{t:'Why Characters Still Matter',p:`Chinese characters date back to the bones and shells used in ancient times. Each symbol carries a story, and the art of calligraphy turns writing into a picture. My grandfather, a native speaker of a southern dialect, still writes letters by hand. "Characters are the system that connects us," he says. Despite the popularity of English, the number of learners of Chinese is rising, and the language is now a major subject in many countries. For me, character and culture can never be separated.`},
 'b2-U1':{t:'Saving the Old City',p:`The old city is a treasure of cultural heritage, but a new dam would flood the whole valley. The committee has investigated the issue and made a proposal: move the temple and the relics to higher ground. Many people protested at first. However, experts explained that the project would preserve the site for the next generation. Local people contributed money and time, and the government donated equipment. The work is likely to take three years. "We cannot prevent change," said an official, "but we can protect what matters."`},
 'b2-U2':{t:'The Antelope on the Plain',p:`The Tibetan antelope lives on the high plain, where the air is thin and the wind is cold. Hunters once killed the animals for their fur, and the species was in danger of extinction. Now rangers watch over the reserve day and night. They measure the herds, observe the young and remind drivers to slow down. The number of antelopes has begun to recover. "Every creature has a place," a ranger told me. "If we protect the habitat, we protect ourselves." I made out a small group in the distance and felt a strange harmony.`},
 'b2-U3':{t:'A Week Without Wi-Fi',p:`Last week our network went down and I felt completely stuck. I could not update my blog, check my account or stream a film. At first I kept track of nothing but my battery. Then I began to read. I found a database of old newspapers in the library and spent whole afternoons there. Without the constant chat, the distance from my family grew smaller. Now that I am back online, I still keep one habit: one hour a day, no screen. The Internet is convenient, but it should never take the place of real life.`},
 'b2-U4':{t:'A Walk Through the Old Town',p:`Our town has a long history. The kingdom was founded more than a thousand years ago, and the old castle still stands near the port. In the courtyard of the mansion a guide pointed to a stone with a strange dot: the mark of an ancient chief. "The Romans built this road," she said. "Later the Normans surrounded the town with walls." We tasted local beer and stew in a pub, and listened to a poet tell the legend of the battle. Customs like these are the evidence of who we are.`},
 'b2-U5':{t:'The Virtual Choir',p:`Eric Whitacre had an unusual idea. He invited singers from different countries to record themselves, and then he put the videos together. The result was a virtual choir: hundreds of ordinary voices, one performance. None of the singers had ever met, yet the harmony was perfect. The project proves that talent does not need a stage. It also shows how technology can enable a composer to work with people he has never seen. For many young people, that was the moment they fell in love with classical music.`}

/* ---------- 发音 ---------- */
let VOICES=[];
function refreshVoices(){try{VOICES=(window.speechSynthesis&&speechSynthesis.getVoices())||[];}catch(e){VOICES=[];}}
function pickVoice(){
  const lang=S.set.accent.toLowerCase();
  const same=VOICES.filter(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(lang.slice(0,2)));
  return same.find(v=>(v.lang||'').replace('_','-').toLowerCase()===lang)||same[0]||VOICES[0]||null;
}
function speak(text){
  if(!window.speechSynthesis){toast('当前浏览器不支持语音朗读');return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=S.set.accent;u.rate=Number(S.set.rate)||0.55;u.pitch=1;
    const v=pickVoice(); if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){toast('朗读失败');}
}

function qAll(){return S.bank||[];}
function qStat(q){return (S.qst&&S.qst[q.id])||{r:0,w:0};}
function qAcc(q){const s=qStat(q),n=s.r+s.w;return n?Math.round(s.r/n*100):null;}
function qBlankCount(s){return Math.max(1,((s||'').match(/_{2,}/g)||[]).length);}
function qStemHtml(s){return esc(s).replace(/_{2,}/g,'<span class="qb-blank"></span>');}
function qAnsText(q){

    const L=String(q.answer||'').toUpperCase();
    const i=L.charCodeAt(0)-65;
    return L+(q.options[i]?(' · '+q.options[i]):'');
  }
  return Array.isArray(q.answer)?q.answer.join(' / '):String(q.answer||'');
}

/* ---- 答题 ---- */
let qz=null;
function qNorm(s){
  return String(s==null?'':s).toLowerCase()
    .replace(/[’‘']/g,'')            /* 撇号直接抹掉：don't = dont */
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
/* 判两段答案是否等价：先常规比，再去空格兜底（her self = herself） */
function qSame(a,b){
  const A=qNorm(a),B=qNorm(b);
  if(!A||!B) return false;
  return A===B || A.replace(/\s/g,'')===B.replace(/\s/g,'');
}
function openQuiz(){
  let list=qAll().slice();
  if(qFilter!=='all') list=list.filter(function(q){return q.type===qFilter;});
  if(!list.length){toast('这里还没有题目');return;}
  list.sort(function(a,b){
    const A=qAcc(a),B=qAcc(b);
    if(A===null&&B!==null)return -1;
    if(B===null&&A!==null)return 1;
    return (A||0)-(B||0);
  });
  qz={list:list,i:0,checked:false,right:0,wrong:0,answers:[],wrongList:[]};
  drawQuiz();
}
function drawQuiz(){
  const q=qz.list[qz.i],n=qz.list.length,rnd=qz.i+1;
  const isChoice=q.options&&q.options.length>=2;
  const val=qz.answers[qz.i];
  let body='';
  if(isChoice){
    body='<div class="qb-optlist">'+q.options.map(function(o,i){
      const L=String.fromCharCode(65+i);
      let cls='qb-opt';
      if(qz.checked){
        if(L===String(q.answer).toUpperCase()) cls+=' right';
        else if(val===L) cls+=' wrong';
      }else if(val===L) cls+=' sel';
      return '<button class="'+cls+'" data-qpick="'+L+'"><b>'+L+'</b><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
  }else{
    const k=qBlankCount(q.stem);
    body='<div class="qb-inputs">';
    for(let b=0;b<k;b++){
      const v=Array.isArray(val)?(val[b]||''):(b===0?(val||''):'');
      body+='<input class="qb-input" data-qin="'+b+'" value="'+esc(v)+'"'+(qz.checked?' readonly':'')+
        ' placeholder="第 '+(b+1)+' 空" autocomplete="off" spellcheck="false">';
    }
    body+='</div>';
  }

  let fb='';
  if(qz.checked){
    const ok=qz.lastOk;
    fb='<div class="qb-fb '+(ok?'ok':'bad')+'">'+
      '<div class="qb-fb-t">'+(ok?'✓ 回答正确':'✗ 回答错误')+'</div>'+
      '<div class="qb-fb-a">正确答案：<b>'+esc(qAnsText(q))+'</b></div>'+
      (q.analysis?'<div class="qb-fb-x"><span>解析</span>'+esc(q.analysis)+'</div>':'')+
      '</div>';
  }

  document.getElementById('layer').innerHTML='<div class="mask"><div class="sheet qb-sheet">'+
    '<button class="x" data-qz="close">×</button>'+
    '<div class="qb-top"><span class="qb-tag">'+(QTYPE[q.type]||'试题')+'</span>'+
      '<span class="qb-prog">'+rnd+' / '+n+'</span>'+
      '<span class="spacer"></span>'+
      '<span class="qb-score">对 '+qz.right+' · 错 '+qz.wrong+'</span></div>'+
    '<div class="qb-qstem">'+qStemHtml(q.stem)+'</div>'+
    body+fb+
    '<div class="row qb-actions">'+
      (qz.checked
        ? '<button class="btn btn-g" data-qz="next">'+(rnd>=n?'看成绩':'下一题')+'（回车）</button>'
        : '<button class="btn btn-g" data-qz="submit">提交批改</button>')+
    '</div></div></div>';

  if(!isChoice&&!qz.checked){
    const inp=document.querySelector('.qb-input');
    if(inp) inp.focus();
  }
}
function qSubmit(){
  const q=qz.list[qz.i];
  const isChoice=q.options&&q.options.length>=2;
  let val;
  if(isChoice){
    val=qz.answers[qz.i];
    if(!val){toast('先选一个选项');return;}
  }else{
    const ins=Array.prototype.slice.call(document.querySelectorAll('.qb-input'));
    val=ins.map(function(x){return x.value.trim();});
    if(!val.length||val.every(function(v){return !v;})){toast('先写出答案');return;}
    qz.answers[qz.i]=val;
  }
  let ok;
  if(isChoice){
    ok=String(val).toUpperCase()===String(q.answer).toUpperCase();
  }else{
    const ans=Array.isArray(q.answer)?q.answer:[q.answer];
    const got=Array.isArray(val)?val:[val];
    ok=ans.length>0&&ans.every(function(a,i){ return qSame(a,got[i]); });
  }
  qz.checked=true; qz.lastOk=ok;
  if(ok) qz.right++; else { qz.wrong++; qz.wrongList.push(q.id); }

  if(!S.qst)S.qst={};
  const s=S.qst[q.id]||{r:0,w:0};
  s.r+=(ok?1:0); s.w+=(ok?0:1); s.last=today();
  S.qst[q.id]=s;
  save();
  drawQuiz();
}
function qNext(){
  if(qz.i+1>=qz.list.length){ drawQuizEnd(); return; }
  qz.i++; qz.checked=false; drawQuiz();
}
function drawQuizEnd(){
  const n=qz.list.length,ok=qz.right;
  const rate=n?Math.round(ok/n*100):0;
  const wrong=qz.wrongList.map(function(id){return qAll().find(function(q){return q.id===id;});}).filter(Boolean);
  document.getElementById('layer').innerHTML='<div class="mask"><div class="sheet qb-sheet" style="width:min(680px,94vw)">'+
    '<button class="x" data-qz="close">×</button>'+
    '<h3>本轮成绩</h3>'+
    '<div class="qb-end"><div class="qb-big">'+rate+'<span>%</span></div>'+
      '<div class="qb-end-sub">答对 '+ok+' / '+n+' 题</div></div>'+
    (wrong.length
      ? '<div class="qb-wrongbox"><div class="qb-wrong-t">需要再练的题</div>'+
        wrong.map(function(q){return '<div class="qb-wrong-i">'+qStemHtml(q.stem).slice(0,90)+'…</div>';}).join('')+
        '</div>'
      : '<div class="qb-fb ok"><div class="qb-fb-t">全对，这组题已经掌握</div></div>')+
    '<div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px">'+
      '<button class="btn btn-o" data-qz="close">关闭</button>'+
      (wrong.length?'<button class="btn btn-g" data-qz="redo">只练错题</button>':'')+
    '</div></div></div>';
}
function qRedoWrong(){
  const ids=qz.wrongList.slice();
  const list=ids.map(function(id){return qAll().find(function(q){return q.id===id;});}).filter(Boolean);
  if(!list.length){toast('没有错题');return;}
  qz={list:list,i:0,checked:false,right:0,wrong:0,answers:[],wrongList:[]};
  drawQuiz();
}

function saveQ(id){
  const type=document.getElementById('qfType').value;
  const stem=document.getElementById('qfStem').value.trim();
  const opts=document.getElementById('qfOpts').value.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);
  const ansRaw=document.getElementById('qfAns').value.trim();
  const ana=document.getElementById('qfAna').value.trim();
  if(!stem){toast('题干不能为空');return;}
  if(!ansRaw){toast('答案不能为空');return;}
  const isChoice=opts.length>=2;
  let answer;
  if(isChoice){
    const m=ansRaw.match(/^([A-Da-d])/);
    answer=m?m[1].toUpperCase():ansRaw.toUpperCase();
  }else if(stem.match(/_{2,}/g)&&qBlankCount(stem)>1){
    answer=ansRaw.split(/\s*[\/｜|]\s*/).filter(Boolean);
  }else{
    answer=ansRaw;
  }
  if(!S.bank)S.bank=[];
  if(id){
    const q=S.bank.find(function(x){return x.id===id;});
    if(q){q.type=type;q.stem=stem;q.options=opts;q.answer=answer;q.analysis=ana;}
  }else{
    S.bank.unshift({id:'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      type:type,stem:stem,options:opts,answer:answer,analysis:ana,created:today()});
  }
  save();closeLayer();render();
  toast(id?'已保存修改':'已加入题库');
}

function parseQuestions(text){
  const lines=String(text||'').split(/\r?\n/);
  const out=[]; let cur=null;
  const push=function(){ if(cur&&cur.stem.trim()) out.push(cur); cur=null; };
  lines.forEach(function(raw){
    const t=raw.trim();
    if(!t) return;
    let m;
    if((m=t.match(/^(?:答案|参考答案|Answer)\s*[:：]?\s*(.*)$/i))){ if(cur)cur.answer=(m[1]||'').trim(); return; }
    if((m=t.match(/^(?:解析|分析|详解|点拨|Explanation)\s*[:：]?\s*(.*)$/i))){ if(cur)cur.analysis=(m[1]||'').trim(); return; }
    if((m=t.match(/^([A-Da-d])\s*[.、)]\s*(.+)$/))){ if(cur)cur.options.push(m[2].trim()); return; }
    if((m=t.match(/^(\d{1,3})\s*[.、)]\s*(.+)$/))){ push(); cur={stem:m[2].trim(),options:[],answer:'',analysis:''}; return; }
    if(cur){
      if(cur.options.length) cur.options[cur.options.length-1]+=' '+t;
      else if(cur.answer!==''&&!cur.analysis) cur.analysis+=(cur.analysis?' ':'')+t;
      else cur.stem+=' '+t;
    }
  });
  push();
  out.forEach(function(q){
    const ans=String(q.answer||'').trim();
    q.type=q.options.length>=2?'choice':(q.stem.indexOf('___')>=0?'blank':'short');
    if(q.type==='choice'){
      const m=ans.match(/^([A-Da-d])/);
      q.answer=m?m[1].toUpperCase():ans.toUpperCase();
    }else{
      q.answer=ans.replace(/^[A-Da-d]\s*[.、)]\s*/,'').trim();
    }
  });
  return out.filter(function(q){return q.stem&&q.answer;});
}
function doQBulk(){
  const t=document.getElementById('qbText').value;
  const qs=parseQuestions(t);
  if(!qs.length){toast('没识别出题目。检查一下是不是有「1. 题干」和「答案：」这样的行');return;}
  if(!S.bank)S.bank=[];
  const fresh=qs.map(function(q){
    return {id:'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      type:q.type,stem:q.stem,options:q.options,answer:q.answer,analysis:q.analysis,created:today()};
  });
  /* 整批插到最前，但保持原有题序，不能逐条 unshift 把顺序倒过来 */
  S.bank=fresh.concat(S.bank);
  save();closeLayer();render();
  toast('已导入 '+qs.length+' 道题');
}

  const list=scopeWords(); if(!list.length){stage.innerHTML='<div class="empty">这个词表范围里还没有词</div>';return;}
  stage.innerHTML='';
  const pool=list.slice();

  const n=Math.min(20,pool.length);

  for(let i=0;i<n;i++){

    const el=document.createElement('div');
    el.className='chip';el.textContent=x.w;

    const dur=13+Math.random()*9;

    el.style.animationDelay=(-Math.random()*dur)+'s';
    el.style.fontSize=(12+Math.random()*3)+'px';

  }
}

let spell=null;

function startSpell(list){
  if(!list||!list.length){toast('这个词表范围里没有可拼写的词');return;}
  const arr=list.slice().sort(function(){return Math.random()-0.5;}).slice(0,20);
  spell={list:arr,i:0,ok:0,checked:false,correct:false};
  drawSpell();
}
function spellNorm(s){
  return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
}
function drawSpell(){
  const s=spell; if(!s) return;
  if(s.i>=s.list.length){
    const rate=s.list.length?Math.round(s.ok/s.list.length*100):0;
    document.getElementById('layer').innerHTML='<div class="mask"><div class="sheet" style="width:min(460px,94vw);text-align:center">'+
      '<h3>拼写完成</h3><div class="sm">共 '+s.list.length+' 个词</div>'+
      '<div class="flash"><div class="w" style="color:var(--g-d)">'+rate+'%</div>'+
      '<div class="tip">正确率 · 拼对 '+s.ok+' / '+s.list.length+'</div></div>'+
      '<div class="ansrow" style="grid-template-columns:1fr 1fr">'+
      '<button data-sp="close">回到词表</button><button data-sp="again">再来一轮</button></div></div></div>';
    return;
  }
  const x=s.list[s.i];
  const letters=(x.w.match(/[A-Za-z]/g)||[]).length;
  const hint=x.w.slice(0,Math.max(1,Math.ceil(x.w.length/3)));
  document.getElementById('layer').innerHTML='<div class="mask"><div class="sheet" style="width:min(520px,94vw)">'+
    '<button class="x" data-sp="close">×</button>'+
    '<h3>单词拼写</h3><div class="sm">'+esc(x.unitName)+' · 第 '+(s.i+1)+' / '+s.list.length+' 题 · 共 '+letters+' 个字母</div>'+
    '<div class="flash" style="margin:20px 0 0"><div class="d" style="margin:0;font-size:16px;color:var(--ink)">'+esc(x.d)+'</div>'+
      '<div class="spell-meta" id="spellHint">首字母：'+esc(hint)+'…</div></div>'+
    '<input id="spellInput" class="spell-in" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在这里拼写">'+
    '<div class="spell-fb" id="spellFb"></div>'+
    '<div class="prog"><i style="width:'+Math.round(s.i/s.list.length*100)+'%"></i></div>'+
    '<div class="ansrow" id="spellBtns">'+
      '<button data-sp="submit">提交</button>'+
      '<button data-sp="audio">朗读</button>'+
      '<button data-sp="hint">提示</button>'+
      '<button data-sp="skip">跳过</button>'+
    '</div></div></div>';
  const inp=document.getElementById('spellInput');
  if(inp) setTimeout(function(){ try{inp.focus();}catch(e){} },60);
}
function spellCheck(){
  const s=spell; if(!s||s.checked) return;
  const inp=document.getElementById('spellInput');
  const x=s.list[s.i];
  const v=spellNorm(inp?inp.value:'');
  if(!v){toast('先输入拼写');return;}
  const right=spellNorm(x.w);
  s.checked=true; s.correct=(v===right);
  if(s.correct){ s.ok++; S.lv[x.id]=2; } else { S.lv[x.id]=1; }
  save();
  if(inp){ inp.classList.add(s.correct?'ok':'bad'); inp.readOnly=true; }
  const fb=document.getElementById('spellFb');
  if(fb){
    fb.innerHTML=s.correct
      ? '<span style="color:#2E7D45">✓ 拼写正确</span>'
      : '✗ 正确拼写：<b style="color:#B8442F;letter-spacing:1px">'+esc(x.w)+'</b>';
  }
  const btns=document.getElementById('spellBtns');
  if(btns) btns.innerHTML='<button data-sp="next" style="grid-column:1/-1">'+(s.i+1>=s.list.length?'看成绩':'下一题')+'（回车）</button>';
  renderNav();
}

  const s=spell; if(!s||!s.checked) return;

async function handleFiles(files){
  if(!files||!files.length)return;
  const isImg=function(f){return /\.(png|jpe?g|webp|bmp|gif)$/i.test(f.name);};
  toast(files.length===1&&isImg(files[0])?'正在调用 OCR 识别…':'正在解析 '+files.length+' 个文件…');
  let ok=0; const fail=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    try{
      const r=await parseFile(f);
      if(!r||!r.text||!r.text.trim()){ fail.push(f.name+'(未提取到文字)'); continue; }
      if(r.kind==='OCR 图片'){ openOcrReview(f.name,r.text,r.img); ok++; continue; }
      addPaper(f.name,r.text,r.kind);
      ok++;
    }catch(err){ fail.push(f.name+'：'+err.message); }
  }
  if(ok&&fail.length===0) render();
  if(ok) toast('已处理 '+ok+' 个文件'+(fail.length?('，'+fail.length+' 个失败'):''));
  else toast(fail[0]||'导入失败');
}

async function parseFile(file){
  const n=file.name.toLowerCase();
  if(/\.(png|jpe?g|webp|bmp|gif)$/.test(n)){ const r=await ocrImage(file); return {text:r.text,kind:'OCR 图片',img:r.img}; }
  if(/\.(txt|md|csv)$/.test(n)) return {text:await file.text(),kind:'文本'};
  if(/\.(html|htm)$/.test(n)) return {text:htmlToText(await file.text()),kind:'网页'};
  if(/\.docx$/.test(n)) return {text:await docxText(await file.arrayBuffer()),kind:'Word'};
  if(/\.pdf$/.test(n)){
    const buf=await file.arrayBuffer();
    /* 先走文字层：电子版 PDF 直接抽字，又快又准 */
    let pure='';
    try{ pure=await pdfText(buf); }catch(e){ pure=''; }
    if(pure&&pure.trim()) return {text:pure,kind:'PDF'};
    /* 没有文字层 = 扫描件，把每页的 JPEG 抠出来走 OCR */
    toast('扫描件 PDF：正在逐页识别，请稍候…');
    const r=await pdfOcr(buf,function(cur,total){
      if(cur===1||cur%2===0||cur===total)
        toast('逐页识别中… '+cur+'/'+total+(total>10?'（约 '+(total-cur)+' 页剩余）':''));
    },40);
    const kind='PDF 扫描件（OCR '+r.ok+'/'+r.done+' 页'+(r.cut?('，共 '+r.pages+' 页仅取前 '+r.done+' 页'):'')+'）';
    return {text:r.text,kind:kind};
  }
  if(/\.doc$/.test(n)) throw new Error('旧版 .doc 打不开，请在 Word 里「另存为」.docx 再导入（或直接截图/导出 PDF 走识别）');
  throw new Error('不支持的格式');
}

/* ---------- OCR：调用本机 Umi-OCR 的 HTTP 接口 ---------- */
function ocrBase(){
  return String(S.set.ocrUrl||'http://127.0.0.1:1224').replace(/\/+$/,'');
}
function fileToBase64(file){
  return new Promise(function(res,rej){
    const fr=new FileReader();
    fr.onload=function(){ const s=String(fr.result); res({b64:s.slice(s.indexOf(',')+1),url:s}); };
    fr.onerror=function(){ rej(new Error('读取图片失败')); };
    fr.readAsDataURL(file);
  });
}
/* 识别质量自检：正常试卷（英文或中英混排）里「乱码字符」占比极低，一旦超标基本就是糊了 */
function ocrSuspect(t){
  const s=String(t||'');
  if(s.length<20) return '';
  /* 允许：拉丁字母数字、空白、西文标点、中日韩汉字、中日韩标点、全角符号 */
  const bad=(s.match(/[^\w\s.,!?;:'"()\[\]\-–—…·%&*+/@#$~`^<>={}｜_\\|\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/g)||[]).length;
  const ratio=bad/s.length;
  if(ratio>0.15) return '这段结果里乱码字符占 '+(ratio*100).toFixed(0)+'%，基本可以判定图片太小/太糊，请只截题目区域放大后重新识别。';
  const words=s.match(/[A-Za-z]{2,}/g)||[];
  if(words.length>5){
    const avg=words.reduce(function(a,w){return a+w.length;},0)/words.length;
    if(avg<2.8||avg>11) return '识别出的英文单词平均长度 '+avg.toFixed(1)+' 个字母，明显偏离正常英语（约 5～7），建议放大后重试。';
  }
  return '';
}
/* 识别前先确认对面的确是真的 Umi-OCR：真服务的参数表每个参数都有 title + optionsList，
   其它随便一个 HTTP 服务（含各种 mock、代理、占位页）都拿不到这个结构，直接拒掉，
   避免「服务没起、连到别的东西，却回一段看似正常的文字」这种假成功。 */
let _ocrCap=null;
async function ocrCap(){
  if(_ocrCap) return _ocrCap;
  const url=ocrBase();
  const ctrl=new AbortController();
  const t=setTimeout(function(){ctrl.abort();},6000);
  try{
    const r=await fetch(url+'/api/ocr/get_options',{signal:ctrl.signal});
    const j=await r.json();
    const real=Object.keys(j||{}).some(function(k){const v=j[k];return v&&v.title&&v.optionsList;});
    if(!real) throw new Error(
      '这个地址回应的不是 Umi-OCR：参数表里没有 title / optionsList 结构。'+
      '请确认接口地址对不对，或者端口上是不是被别的程序占了。'
    );
    _ocrCap={raw:j};
    return _ocrCap;
  }catch(e){
    if(e.name==='AbortError') throw new Error('连不上 OCR 服务（6 秒无响应）。请先打开 Umi-OCR，并在全局设置里勾选「HTTP 服务」后点「启动」。');
    if(e instanceof TypeError) throw new Error('连不上 '+url+'：端口上没有程序在听。请先双击打开 Umi-OCR（别关窗口），或检查代理/加速器是否拦截了 127.0.0.1。');
    throw e;
  }finally{ clearTimeout(t); }
}
/* 把界面上的语义值，翻译成当前引擎真正认识的键名和取值。
   PaddleOCR: ocr.language="models/config_chinese.txt" / ocr.limit_side_len / ocr.cls
   RapidOCR : ocr.language="简体中文"                   / ocr.maxSideLen     / ocr.angle
   传错键名不会被报错，只会被静默忽略，于是「以为调了参数其实没调」。 */
const OCR_LANG_ALIAS={
  chinese:['简体中文','models/config_chinese.txt','简体中文（中英混排）','Chinese'],
  en:['English','models/config_en.txt','英文'],
  cht:['繁體中文','models/config_chinese_cht(v2).txt','繁体中文'],
  jp:['日本語','models/config_japan.txt','日语'],
  kr:['한국어','models/config_korean.txt','韩语']
};
function buildOcrOptions(cap){
  const j=(cap&&cap.raw)||{};
  const o={'data.format':'text'};

  /* 语言：优先用用户选的语义，落地时挑服务端 optionsList 里真实存在的那个名字 */
  if(j['ocr.language']){
    const list=((j['ocr.language'].optionsList)||[]).map(function(x){return x[0];});
    const want=OCR_LANG_ALIAS[S.set.ocrLang]||OCR_LANG_ALIAS.chinese;
    let hit=null;
    for(let i=0;i<want.length&&!hit;i++){ if(list.indexOf(want[i])>=0) hit=want[i]; }
    if(!hit&&list.length) hit=list[0];
    if(hit) o['ocr.language']=hit;
  }

  /* 精度：不同引擎键名和档位都不同，按「不小于目标值的最小档」挑，挑不到就用最大档 */
  const sideKey=j['ocr.maxSideLen']!==undefined?'ocr.maxSideLen'
               :j['ocr.limit_side_len']!==undefined?'ocr.limit_side_len':null;
  if(sideKey){
    const nums=((j[sideKey].optionsList)||[]).map(function(x){return Number(x[0]);})
      .filter(function(n){return !isNaN(n);}).sort(function(a,b){return a-b;});
    if(nums.length){
      let pick=nums[nums.length-1];
      if(S.set.ocrSide==='fast') pick=nums[0];
      else if(S.set.ocrSide!=='max'){
        const target=4000;   /* 落地成 PaddleOCR 的 4320 或 RapidOCR 的 4096 */
        for(let i=0;i<nums.length;i++){ if(nums[i]>=target){ pick=nums[i]; break; } }
      }
      o[sideKey]=pick;
    }
  }

  /* 纠方向：PaddleOCR 叫 ocr.cls，RapidOCR 叫 ocr.angle */
  const angKey=j['ocr.cls']!==undefined?'ocr.cls':j['ocr.angle']!==undefined?'ocr.angle':null;
  if(angKey) o[angKey]=S.set.ocrCls!==false;

  /* 排版：两家取值一致，但仍确认服务端支持再传 */
  const pl=((j['tbpu.parser']&&j['tbpu.parser'].optionsList)||[]).map(function(x){return x[0];});
  const p=S.set.ocrParser||'single_para';
  if(!pl.length||pl.indexOf(p)>=0) o['tbpu.parser']=p;
  else if(pl.indexOf('single_para')>=0) o['tbpu.parser']='single_para';

  return o;
}
/* 核心：把一张图的 base64 交给 OCR，返回文本。图片和 PDF 抽出的页图都走这里。
   两种引擎：
     ① 本机 Umi-OCR（准、快，但要装软件、只在本机）
     ② 浏览器内置 tesseract.js（随站点部署，换任何设备打开都能用）
   auto 模式先试本机，连不上自动切浏览器，云端部署时就是纯浏览器识别。 */
async function ocrLocal(b64){
  const url=ocrBase();
  const cap=await ocrCap();
  const options=buildOcrOptions(cap);
  let ctrl=null,timer=null;
  try{
    ctrl=new AbortController();
    timer=setTimeout(function(){ctrl.abort();},90000);
    const r=await fetch(url+'/api/ocr',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({base64:b64,options:options}),
      signal:ctrl.signal
    });
    const j=await r.json();
    if(j.code===100){
      let txt=typeof j.data==='string'?j.data:'';
      if(!txt&&Array.isArray(j.data)) txt=j.data.map(function(x){return x.text||x.t||'';}).join('\n');
      if(!txt||!txt.trim()) throw new Error('图片里没有识别到文字');
      return txt;
    }
    if(j.code===101) throw new Error('图片里没有识别到文字');
    throw new Error('OCR 返回失败：'+(typeof j.data==='string'?j.data:('code '+j.code)));
  }catch(err){
    if(err.name==='AbortError') throw new Error('OCR 超时（90 秒），图片太大可先压缩');
    if(err instanceof TypeError){
      if(location.protocol==='https:' && url.indexOf('http://')===0)
        throw new Error('线上版（https）访问本地 http 服务被浏览器拦截，请把本 HTML 下载到电脑双击打开再用 OCR');
      throw new Error('连不上 OCR 服务，请先双击启动 Umi-OCR');
    }
    throw err;
  }finally{ if(timer)clearTimeout(timer); }
}

/* ---------- 浏览器内置 OCR：tesseract.js，资源随站点一起部署 ---------- */
let _tess=null,_tessLoading=null,_tessProg=null,_tessPsm=null;
/* 部署地址：只在页面自身没有 http(s) 基准地址时用作兜底（预览面板、srcdoc 等宿主） */
var OCR_DEPLOY_ROOT='https://yzxx167.github.io/enginsight/';
function ocrAsset(p){
  /* 正常网页：用自身地址拼 ocr/ 路径。
     被内置预览面板用 blob:/srcdoc 加载时自身地址不是有效基准（new URL 会抛 Invalid URL），
     回退到线上部署地址——GitHub Pages 带 CORS，模型和 wasm 都能跨域取。 */
  var bases=[location.href,document.baseURI];
  for(var i=0;i<bases.length;i++){
    var b=bases[i];
    if(!b) continue;
    try{
      var u=new URL(b);
      if(u.protocol==='http:'||u.protocol==='https:') return new URL('ocr/'+p,u).href;
    }catch(e){}
  }
  return new URL('ocr/'+p,OCR_DEPLOY_ROOT).href;
}
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_tessLoading) return _tessLoading;
  _tessLoading=new Promise(function(res,rej){
    const s=document.createElement('script');
    s.src=ocrAsset('tesseract.min.js');
    s.onload=function(){ window.Tesseract?res(window.Tesseract):rej(new Error('OCR 引擎加载异常')); };
    s.onerror=function(){ _tessLoading=null; rej(new Error('OCR 引擎加载失败：找不到 ocr/tesseract.min.js')); };
    document.head.appendChild(s);
  });
  return _tessLoading;
}
/* 小图先放大：截图常常只有三四百像素宽，字高不到 12px，
   tesseract 在这个尺寸上几乎认不出，放大到字高 30px 以上才靠谱。 */
function loadImg(src){
  return new Promise(function(res,rej){
    const im=new Image();
    im.onload=function(){res(im);};
    im.onerror=function(){rej(new Error('图片读取失败'));};
    im.src=src;
  });
}
async function upscaleSmall(dataUrl){
  let im;
  try{ im=await loadImg(dataUrl); }catch(e){ return dataUrl; }
  const minW=1100,minH=150;
  if(im.width>=minW&&im.height>=minH) return dataUrl;
  const sc=Math.min(4,Math.max(minW/im.width,minH/im.height));
  if(sc<=1) return dataUrl;
  const c=document.createElement('canvas');
  c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=true;
  if('imageSmoothingQuality' in g) g.imageSmoothingQuality='high';
  g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(im,0,0,c.width,c.height);
  return c.toDataURL('image/png');
}
/* 中文模型会在每个汉字之间插空格，这里收拾干净；英文单词之间的空格保持不动 */
function tidyOcr(s){
  return String(s||'')
    .replace(/([\u4e00-\u9fff])\s+(?=[\u4e00-\u9fff])/g,'$1')
    .replace(/\s*([，。、；：？！）】」』》])\s*/g,'$1')
    .replace(/\s*([（【「『《])\s*/g,'$1')
    .replace(/[ \t]+\n/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
async function ocrBrowser(dataUrl,onProgress){
  if(location.protocol==='file:'){
    throw new Error('你现在是直接双击本地文件打开的，浏览器不允许这种页面跑识别引擎。两个办法：① 打开线上地址 https://yzxx167.github.io/enginsight/ 使用（换任何设备都能识别）；② 保持本页不动，另开 Umi-OCR 用本机识别。');
  }
  const T=await loadTesseract();
  if(!_tess){
    _tessProg=onProgress;
    /* 中英双语：chi_sim 让中文题干不再变成乱码英文 */
    _tess=await T.createWorker('eng+chi_sim',1,{
      workerPath:ocrAsset('worker.min.js'),
      corePath:ocrAsset(''),
      langPath:ocrAsset('tessdata'),
      logger:function(m){
        if(_tessProg&&m&&m.status==='loading tesseract core') _tessProg('正在加载识别引擎…');
        else if(_tessProg&&m&&m.status==='loading language traineddata') _tessProg('首次使用，正在下载语言模型（英文 + 中文，约 4.5MB）…');
        else if(_tessProg&&m&&m.status==='recognizing text') _tessProg('识别中… '+Math.round((m.progress||0)*100)+'%');
      }
    });
  }
  _tessProg=onProgress;
  const ready=await upscaleSmall(dataUrl);
  /* 按图片形状切版面模式：单行截图 VS 文字块 VS 整页扫描，混用会串行、漏字 */
  try{
    const im=await loadImg(ready);
    const psm=psmFor(im.width,im.height);
    if(psm!==_tessPsm){
      await _tess.setParameters({tessedit_pageseg_mode:psm});
      _tessPsm=psm;
    }
  }catch(e){}
  const r=await _tess.recognize(ready);
  return tidyOcr((r&&r.data&&r.data.text)||'');
}
/* 版面模式：7=单行文字 6=一块文字 3=整页自动分区 */
function psmFor(w,h){
  if(!w||!h) return '3';
  const r=w/h;
  if(h<=210&&r>=4) return '7';   /* 又宽又扁：一行字，按单行识别最准 */
  if(r<1.25&&h>820) return '3';  /* 竖长整页扫描：交给自动分区 */
  return '6';                     /* 截图里的题干文字块 */
}

/* 统一入口：按设置决定用哪个引擎，auto 自动降级 */
async function ocrBase64(b64,mime,onProgress){
  const mode=S.set.ocrEngine||'auto';
  const dataUrl='data:'+(mime||'image/png')+';base64,'+b64;
  if(mode!=='browser'){
    try{
      return await ocrLocal(b64);
    }catch(e){
      if(mode==='local') throw e;
      /* auto：本机不在就转浏览器，不打扰用户 */
      if(onProgress) onProgress('本机 OCR 不可用，改用浏览器识别…');
    }
  }
  return await ocrBrowser(dataUrl,onProgress);
}
async function ocrImage(file){
  const img=await fileToBase64(file);
  const text=await ocrBase64(img.b64,file.type||'image/png',function(msg){toast(msg);});
  return {text:text,img:img.url};
}

/* ---------- 扫描版 PDF：把内嵌的 JPEG 原图抠出来逐张 OCR ---------- */
function u8ToBase64(u8){
  let s='';
  const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  return btoa(s);
}
/* 扫描件 PDF 的每页通常是一整张 DCTDecode(JPEG)，在文件里就是 FFD8FF…FFD9，
   直接按魔数切出来即可，不需要解析 PDF 对象树。 */
function pdfImages(buf){
  const u8=new Uint8Array(buf);
  const out=[];
  let i=0;
  while(i<u8.length-3){
    if(u8[i]===0xFF&&u8[i+1]===0xD8&&u8[i+2]===0xFF){
      let j=i+2, end=-1;
      while(j<u8.length-1){
        if(u8[j]===0xFF&&u8[j+1]===0xD9){ end=j+1; break; }
        j++;
      }
      if(end>0&&end-i>2048){ out.push(u8.subarray(i,end+1)); i=end+1; continue; }
    }
    i++;
  }
  return out;
}
async function pdfOcr(buf,onProgress,maxPages){
  const all=pdfImages(buf);
  if(!all.length) throw new Error('这个 PDF 既没有文字层，也找不到可识别的页面图片');
  const max=maxPages||40;
  const imgs=all.slice(0,max);
  let out=[], fail=0, first=null;
  for(let i=0;i<imgs.length;i++){
    if(onProgress) onProgress(i+1,imgs.length);
    try{
      const t=await ocrBase64(u8ToBase64(imgs[i]),'image/jpeg');
      if(t&&t.trim()) out.push(t.trim());
    }catch(e){
      if(!first) first=e;              /* 第 1 页就失败，多半是引擎没就绪，直接抛出去 */
      fail++;
      if(fail>=3&&!out.length) break;
    }
  }
  if(!out.length) throw (first||new Error('PDF 前 '+imgs.length+' 页都没识别出文字（可能是封面/插图页）'));
  return {text:out.join('\n\n'), pages:all.length, done:imgs.length, ok:out.length, fail:fail, cut:all.length>imgs.length};
}

function htmlToText(s){
  return s.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ')
    .replace(/<\/(p|div|br|li|h\d|tr)>/gi,'\n').replace(/<[^>]+>/g,' ')
    .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
}

async function inflateBytes(bytes,fmt){
  if(typeof DecompressionStream==='undefined') throw new Error('浏览器不支持解压，请用新版 Chrome/Edge');
  const run=async function(f){
    const ds=new DecompressionStream(f);
    const st=new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(st).arrayBuffer());
  };
  try{ return await run(fmt); }
  catch(e){ if(fmt!=='deflate') return await run('deflate'); throw e; }
}

/* --- docx：本质是 zip，取 word/document.xml --- */
async function docxText(buf){
  const dv=new DataView(buf);
  let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0) throw new Error('文件结构异常');
  const n=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
  let p=cdOff, target=null;
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), cmtLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const fname=new TextDecoder().decode(new Uint8Array(buf,p+46,nameLen));
    if(fname==='word/document.xml'){ target={method:method,csize:csize,lho:lho}; }
    p+=46+nameLen+extraLen+cmtLen;
    if(target) break;
  }
  if(!target) throw new Error('不是有效的 Word 文档');
  const lnameLen=dv.getUint16(target.lho+26,true), lextra=dv.getUint16(target.lho+28,true);
  const start=target.lho+30+lnameLen+lextra;
  let data=new Uint8Array(buf,start,target.csize);
  if(target.method!==0) data=await inflateBytes(data,'deflate-raw');
  let xml=new TextDecoder('utf-8').decode(data);
  xml=xml.replace(/<w:tab[^>]*\/>/g,'\t').replace(/<w:br[^>]*\/>/g,'\n').replace(/<\/w:p>/g,'\n');
  return xml.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
}

/* --- pdf：解压 FlateDecode 流，抽取文本操作符 --- */
async function pdfText(buf){
  const u8=new Uint8Array(buf);
  const latin=new TextDecoder('latin1');
  const whole=latin.decode(u8);
  const chunks=[];
  let idx=0, guard=0;
  while(guard++<4000){
    const a=whole.indexOf('stream',idx);
    if(a<0) break;
    let s=a+6;
    if(whole[s]==='\r')s++;
    if(whole[s]==='\n')s++;
    const b=whole.indexOf('endstream',s);
    if(b<0) break;
    idx=b+9;
    let data=u8.subarray(s,b);
    while(data.length&&(data[data.length-1]===10||data[data.length-1]===13)) data=data.subarray(0,data.length-1);
    if(!data.length) continue;
    let out=null;
    try{ out=await inflateBytes(data,'deflate'); }catch(e){ out=null; }
    if(!out) continue;
    const txt=latin.decode(out);
    if(txt.indexOf('Tj')<0&&txt.indexOf('TJ')<0&&txt.indexOf('BT')<0) continue;
    chunks.push(extractTextOps(txt));
  }
  const text=chunks.join('\n');
  if(!text.trim()) throw new Error('这个 PDF 没有文字层（扫描件），需要走图片识别');
  return text;
}

function pdfUnescape(s){
  return s.replace(/\\([nrtbf()\\])/g,function(_,c){
    return {n:'\n',r:'\r',t:'\t',b:'\b',f:'\f','(':'(',')':')','\\':'\\'}[c]||c;
  }).replace(/\\([0-7]{1,3})/g,function(_,o){return String.fromCharCode(parseInt(o,8));});
}

function pdfHex(h){
  let s=h.replace(/\s+/g,'');
  if(s.length%2) s+='0';
  const bytes=[];
  for(let i=0;i<s.length;i+=2) bytes.push(parseInt(s.substr(i,2),16)||0);
  let zeros=0;
  for(let i=0;i<bytes.length;i+=2) if(bytes[i]===0) zeros++;
  if(bytes.length>=4&&zeros>=bytes.length/4){
    let out='';
    for(let i=0;i+1<bytes.length;i+=2) out+=String.fromCharCode((bytes[i]<<8)|bytes[i+1]);
    return out;
  }
  let out='';
  for(let i=0;i<bytes.length;i++) out+=String.fromCharCode(bytes[i]);
  return out;
}

function extractTextOps(s){
  let out='';
  const lines=s.split(/\r?\n/);
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];
    if(/^\s*ET\s*$/.test(ln)) { out+='\n'; continue; }
    if(/(Td|TD|T\*)\s*$/.test(ln)) { out+=' '; }
    let m, re=/\((?:\\[\s\S]|[^()\\])*\)|<([0-9A-Fa-f][0-9A-Fa-f\s]*)>/g;
    while((m=re.exec(ln))!==null){
      const tok=m[0];
      if(tok.charAt(0)==='(') out+=pdfUnescape(tok.slice(1,-1));
      else {
        const inner=m[1]||'';
        if(/[0-9A-Fa-f]/.test(inner)&&inner.replace(/\s/g,'').length>=2) out+=pdfHex(inner);
      }
    }
    if(/\]\s*TJ|\bTj\b/.test(ln)) out+='';
  }
  return out.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n');
}

/* --- 建卡片：与课本词表比对，生成生词清单 --- */
function addPaper(name,text,kind){
  const clean=text.replace(/\r/g,'').replace(/[ \t]+/g,' ').trim();
  const toks=(clean.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).map(function(w){return w.toLowerCase();});
  const uniq={}; toks.forEach(function(w){uniq[w]=(uniq[w]||0)+1;});
  const dict={};
  ALL().forEach(function(x){
    const k=x.w.toLowerCase();
    if(/^[a-z][a-z'’-]*$/.test(k)&&k.length>2&&!dict[k]) dict[k]=x;
  });
  const hits=[], seen={};
  toks.forEach(function(w){
    if(dict[w]&&!seen[w]){ seen[w]=1; hits.push(dict[w]); }
  });
  const paper={
    id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),
    name:name.replace(/\.[^.]+$/,''),
    kind:kind||'导入',
    words:Object.keys(uniq).length,
    hits:hits.length,
    preview:clean.slice(0,160),
    text:clean.slice(0,60000),
    list:hits.slice(0,120).map(function(x){return x.w;}),
    date:new Date().toISOString().slice(0,10)
  };
  S.papers=(S.papers||[]); S.papers.unshift(paper); save();
}

/* ========== 动作 ========== */
function doAct(a,el){
  switch(a){
    case 'review':{
      const todo=scopeWords().filter(function(x){const v=lvOf(x.id);return v===0||v===1;});
      if(!todo.length){toast('这一范围已经没有待复习的词');return;}
      startReview(todo.sort(function(){return Math.random()-0.5;}).slice(0,40));
      break;
    }
    case 'review-all':startReview(scopeWords().slice().sort(function(){return Math.random()-0.5;}).slice(0,40));break;
    case 'spell':{
      const pool=scopeWords();
      const un=pool.filter(function(x){return lvOf(x.id)!==2;});
      startSpell(un.length?un:pool);
      break;
    }
    case 'dict-review':{
      const all=ALL();
      const todo=all.filter(function(x){const v=lvOf(x.id);return v===0||v===1;});
      startReview((todo.length?todo:all).sort(function(){return Math.random()-0.5;}).slice(0,30));
      break;
    }
    case 'read2train':S.set.tab=el.dataset.k;view='train';render();toast('已切到本单元词表');break;
    case 'read-more':window._readAll=!window._readAll;render();break;
    case 'speakpassage':{
      const el2=document.getElementById('passage');
      if(el2)speak(el2.textContent);break;
    }
    case 'expand':{
      const picked=ALL().filter(function(x){return S.star[x.id];});
      const src=(picked.length?picked:ALL()).slice(0,60);
      document.getElementById('wall').innerHTML=src.map(function(x,i){
        return '<div class="wcard '+(S.star[x.id]?'hl ':'')+(i%5===0?'big':'')+'" data-wid="'+esc(x.id)+'">'+
          '<div class="w">'+esc(x.w)+'</div><div class="d">'+esc(x.d)+'</div></div>';
      }).join('');
      toast('已展开 '+src.length+' 条');break;
    }
    case 'dedupe':{
      const src=ALL().slice().sort(function(a,b){return a.w.localeCompare(b.w);}).slice(0,40);
      document.getElementById('wall').innerHTML=src.map(function(x){
        return '<div class="wcard '+(S.star[x.id]?'hl':'')+'" data-wid="'+esc(x.id)+'">'+
          '<div class="w">'+esc(x.w)+'</div><div class="d">'+esc(x.unitName)+' · '+esc(x.d)+'</div></div>';
      }).join('');
      toast('已按字母整理 '+src.length+' 条');break;
    }
    case 'addword':{
      const inp=document.getElementById('dictSearch');
      const q=(inp&&inp.value||'').trim(); if(!q){toast('先输入一个单词');return;}
      const low=q.toLowerCase();
      const hit=ALL().find(function(x){return x.w.toLowerCase()===low;})||
                ALL().find(function(x){return x.w.toLowerCase().indexOf(low)===0;})||
                ALL().find(function(x){return x.d.indexOf(q)>-1;});
      if(!hit){toast('课本词表里没有找到“'+q+'”');return;}
      S.star[hit.id]=true;save();toast('已收录 '+hit.w);render();break;
    }
    case 'newblank':toast('已新建空白讲评（可在卡片区继续管理）');break;
    case 'import':pickFiles();break;
    case 'ocr':pickOcr();break;
    case 'ocr-test':testOcr();break;
    case 'ocr-test-browser':testBrowserOcr();break;
    case 'qadd':openQEdit(null);break;
    case 'qbulk':openQBulk();break;
    case 'qstart':openQuiz();break;
    case 'selall':{
      examList().forEach(function(o){S.sel[o.id]=true;});save();render();toast('已全选');break;
    }
    case 'del':{
      const ids=examList().filter(function(o){return S.sel[o.id];}).map(function(o){return o.id;});
      if(!ids.length){toast('先勾选要删除的讲评');return;}
      ids.forEach(function(id){
        S.sel[id]=false;
        if(id.charAt(0)==='p'){ S.papers=(S.papers||[]).filter(function(x){return x.id!==id;}); }
        else if(S.hidden.indexOf(id)<0){ S.hidden.push(id); }
      });
      save();render();toast('已移除 '+ids.length+' 个讲评卡片');break;
    }
    case 'top':{
      const ids=examList().filter(function(o){return S.sel[o.id];}).map(function(o){return o.id;});
      if(!ids.length){toast('先勾选要置顶的讲评');return;}
      S.order=ids.concat((S.order||[]).filter(function(x){return ids.indexOf(x)<0;}));
      save();render();toast('已置顶');break;
    }
    case 'fs':{
      const d=Number(el.dataset.d);
      S.set.fs=d===0?100:Math.min(140,Math.max(80,S.set.fs+d*10));
      applySet();save();render();break;
    }
    case 'try':speak('Learning a language is like travelling: every word opens a door.');break;
    case 'reset-all':{
      if(!window.confirm('恢复默认设置？学习记录会保留。'))return;
      S.set=Object.assign({},DEF.set);applySet();save();render();toast('已恢复默认设置');break;
    }
    case 'clear':{
      if(!window.confirm('清空所有学习记录（掌握状态与生词本）？'))return;
      S.lv={};S.star={};save();render();toast('学习记录已清空');break;
    }
    case 'test':{
      refreshVoices();
      toast(VOICES.length?('本机可用发音引擎 '+VOICES.length+' 个 · 语音合成正常'):'未检测到发音引擎，将使用浏览器默认语音');
      break;
    }
    case 'drift-toggle':driftToggle(el);break;
    case 'drift-next':{
      const list=scopeWords(); if(!list.length)return;
      const x=list[Math.floor(Math.random()*list.length)];
      const st=document.getElementById('stage');
      if(st){
        st.innerHTML='<div class="drift-card"><div class="big">'+esc(x.w)+'</div>'+
          '<div class="dfn">'+esc(x.d)+'</div>'+
          '<div class="drift-tip" style="margin-top:14px">'+esc(x.unitName)+' · 点击空白处继续漂流</div></div>';
      }
      speak(x.w);break;
    }
  }
}

/* ========== 事件 ========== */
document.addEventListener('click',function(e){
  const go=e.target.closest('[data-go]');
  if(go){view=go.dataset.go;render();window.scrollTo({top:0,behavior:'smooth'});return;}

  const spb=e.target.closest('[data-sp]');
  if(spb&&spell){
    const k=spb.dataset.sp;
    if(k==='close'){spell=null;closeLayer();render();return;}
    if(k==='again'){const l=spell.list;spell=null;startSpell(l);return;}
    if(k==='submit'){spellCheck();return;}
    if(k==='next'){spellNext();return;}
    if(k==='hint'){spellHint();return;}
    if(k==='audio'){speak(spell.list[spell.i].w);return;}
    if(k==='skip'){const x=spell.list[spell.i];S.lv[x.id]=1;save();spell.i++;spell.checked=false;drawSpell();return;}
    return;
  }

  const q=e.target.closest('[data-q]');
  if(q&&review){
    const k=q.dataset.q,x=review.list[review.i];
    if(k==='close'){closeLayer();render();return;}
    if(k==='goto'){closeLayer();view='train';render();return;}
    if(k==='show'){review.shown=true;if(S.set.auto)speak(x.w);drawReview();return;}
    const map={'1':1,'2':1,'3':2,'4':3};
    S.lv[x.id]=map[k]||0;
    if(map[k]===3)S.star[x.id]=true;
    review.i++;review.shown=false;save();drawReview();renderNav();return;
  }
  const mask=e.target.classList&&e.target.classList.contains('mask');
  if(mask){closeLayer();render();return;}

  const sel=e.target.closest('[data-sel]');
  if(sel){e.stopPropagation();const id=sel.dataset.sel;S.sel[id]=!S.sel[id];save();sel.classList.toggle('on');return;}

  const ex=e.target.closest('[data-exam]');
  if(ex){
    const id=ex.dataset.exam;
    if(id.charAt(0)==='p'){ openPaper(id); return; }
    S.set.tab=id;view='train';render();toast('已进入 '+unitByKey(id).name+' 词汇训练');return;
  }

  const sp=e.target.closest('[data-speak]');
  if(sp){speak(sp.dataset.speak);return;}

  const wd=e.target.closest('[data-w]');
  if(wd){speak(wd.dataset.w);toast(wd.dataset.w+' · '+wd.dataset.d);return;}

  const wid=e.target.closest('[data-wid]');
  if(wid){openWord(wid.dataset.wid);return;}

  const tg=e.target.closest('[data-toggle]');
  if(tg){
    const id=tg.dataset.toggle,cur=lvOf(id);
    const next=cur===0?2:cur===2?3:cur===3?0:2;
    if(next===0)delete S.lv[id];else S.lv[id]=next;
    save();render();return;
  }
  const rd=e.target.closest('[data-read]');
  if(rd){S.set.readUnit=rd.dataset.read;save();render();return;}

  /* ---------- 题库批改 ---------- */
  const qf=e.target.closest('[data-qfilter]');
  if(qf){qFilter=qf.dataset.qfilter;render();return;}

  const qe=e.target.closest('[data-qedit]');
  if(qe){openQEdit(qe.dataset.qedit);return;}

  const qd=e.target.closest('[data-qdel]');
  if(qd){
    const id=qd.dataset.qdel;
    S.bank=(S.bank||[]).filter(function(x){return x.id!==id;});
    if(S.qst)delete S.qst[id];
    save();render();toast('已删除');return;
  }

  const qs=e.target.closest('[data-qsave]');
  if(qs){saveQ(qs.dataset.qsave||null);return;}

  const qb=e.target.closest('[data-qbulkok]');
  if(qb){doQBulk();return;}

  const qpk=e.target.closest('[data-qpick]');
  if(qpk&&qz&&!qz.checked){
    qz.answers[qz.i]=qpk.dataset.qpick;
    drawQuiz();return;
  }

  const qz2=e.target.closest('[data-qz]');
  if(qz2&&qz){
    const k=qz2.dataset.qz;
    if(k==='close'){qz=null;closeLayer();render();return;}
    if(k==='submit'){qSubmit();return;}
    if(k==='next'){qNext();return;}
    if(k==='redo'){qRedoWrong();return;}
    return;
  }

  const mk=e.target.closest('[data-mark]');
  if(mk){S.lv[mk.dataset.id]=Number(mk.dataset.mark);save();openWord(mk.dataset.id);renderNav();return;}

  const star=e.target.closest('[data-star]');
  if(star){S.star[star.dataset.star]=!S.star[star.dataset.star];save();openWord(star.dataset.star);return;}

  if(e.target.closest('[data-close]')){closeLayer();render();return;}

  const pstar=e.target.closest('[data-paper-star]');
  if(pstar){
    const p=(S.papers||[]).find(function(x){return x.id===pstar.dataset.paperStar;});
    if(p&&p.list){ p.list.forEach(function(w){const x=ALL().find(function(v){return v.w.toLowerCase()===w;});if(x)S.star[x.id]=true;}); }
    save();toast('已加入生词本');render();return;
  }
  const pdel=e.target.closest('[data-paper-del]');
  if(pdel){
    if(!window.confirm('删除这份导入的讲评？')) return;
    const id=pdel.dataset.paperDel;
    S.papers=(S.papers||[]).filter(function(x){return x.id!==id;});
    save();closeLayer();render();toast('已删除');return;
  }
  const osave=e.target.closest('[data-ocr-save]');
  if(osave){
    const ta=document.getElementById('ocrText');
    const txt=ta?ta.value.trim():'';
    if(!txt){toast('识别结果是空的');return;}
    addPaper(osave.dataset.ocrSave,txt,'OCR 图片');
    closeLayer();render();toast('已生成讲评卡片');return;
  }

  const act=e.target.closest('[data-act]');
  if(act){doAct(act.dataset.act,act);}
});

document.addEventListener('input',function(e){
  if(e.target.id==='scope'){S.set.tab=e.target.value;save();render();return;}
  if(e.target.id==='globalSearch'){
    window._q=e.target.value;
    if(view==='train')render();
    return;
  }
  if(e.target.id==='examSearch'){
    const q=e.target.value.trim().toLowerCase();
    const grid=document.getElementById('examGrid');if(!grid)return;
    let n=0;
    Array.prototype.forEach.call(grid.children,function(c){
      const hit=c.textContent.toLowerCase().indexOf(q)>-1;
      c.style.display=hit?'':'none';if(hit)n++;
    });
    const em=document.getElementById('examEmpty');if(em)em.style.display=n?'none':'';
    return;
  }
  if(e.target.dataset.set==='rate'){
    S.set.rate=Number(e.target.value);
    const r=document.getElementById('rateVal');if(r)r.textContent=S.set.rate.toFixed(2);
    save();return;
  }
  if(e.target.dataset.set==='fs'){
    S.set.fs=Number(e.target.value);applySet();save();
    const v=document.getElementById('fsVal');if(v)v.textContent=S.set.fs+'%';
    return;
  }
});

document.addEventListener('change',function(e){
  if(e.target.name==='accent'){S.set.accent=e.target.value;save();toast('口音已切换为 '+(e.target.value==='en-GB'?'英式':'美式'));return;}
  if(e.target.id==='fontSel'){S.set.font=e.target.value;applySet();save();return;}
  if(e.target.id==='dictSel'){S.set.dict=e.target.value;save();return;}
  if(e.target.id==='aiSel'){S.set.ai=e.target.value;save();return;}
  if(e.target.id==='autoSpeak'){S.set.auto=e.target.checked;save();return;}
  if(e.target.id==='apiId'){S.set.api=e.target.value;save();return;}
  if(e.target.id==='ocrUrl'){S.set.ocrUrl=e.target.value.trim();_ocrCap=null;save();return;}
  if(e.target.id==='ocrLang'){S.set.ocrLang=e.target.value;save();return;}
  if(e.target.id==='ocrParser'){S.set.ocrParser=e.target.value;save();return;}
  if(e.target.id==='ocrSide'){S.set.ocrSide=e.target.value;_ocrCap=null;save();return;}
  if(e.target.id==='ocrCls'){S.set.ocrCls=e.target.value==='1';save();return;}
  if(e.target.id==='ocrEngine'){S.set.ocrEngine=e.target.value;_ocrCap=null;save();return;}
});

/* 截图直接粘贴：Win+Shift+S 截完不用存文件，Ctrl+V 就进来识别 */
document.addEventListener('paste',function(e){
  if(spell||review) return;                 /* 正在答题/复习时不抢剪贴板 */
  const cd=e.clipboardData;
  if(!cd) return;
  const inField=/^(INPUT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'');
  const files=[];
  if(cd.items){
    for(let i=0;i<cd.items.length;i++){
      const it=cd.items[i];
      if(it.kind==='file'&&it.type.indexOf('image')===0){
        const f=it.getAsFile();
        if(f){ files.push(new File([f],'粘贴截图-'+Date.now()+'.png',{type:f.type||'image/png'})); }
      }
    }
  }
  /* 有些截图工具不写 items，只写 files，这里兜底 */
  if(!files.length&&cd.files&&cd.files.length){
    for(let i=0;i<cd.files.length;i++){
      const f=cd.files[i];
      if(f.type&&f.type.indexOf('image')===0) files.push(f);
    }
  }
  if(files.length){
    e.preventDefault();
    if(view!=='exams'){ view='exams'; render(); }
    toast('已收到截图（'+Math.round(files[0].size/1024)+'KB），正在识别…');
    handleFiles(files);
  }else if(!inField&&cd.types&&Array.prototype.indexOf.call(cd.types,'text/plain')<0){
    toast('剪贴板里没有图片。先用 Win+Shift+S 截图，再回来按 Ctrl+V');
  }
});

/* 文件直接拖进页面也能导入 */
let _dragDepth=0;
document.addEventListener('dragenter',function(e){
  if(!e.dataTransfer||Array.prototype.indexOf.call(e.dataTransfer.types,'Files')<0) return;
  _dragDepth++; document.body.classList.add('drag-over');
});
document.addEventListener('dragover',function(e){
  if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types,'Files')>=0) e.preventDefault();
});
document.addEventListener('dragleave',function(){
  _dragDepth=Math.max(0,_dragDepth-1);
  if(!_dragDepth) document.body.classList.remove('drag-over');
});
document.addEventListener('drop',function(e){
  if(!e.dataTransfer) return;
  const fs=e.dataTransfer.files;
  if(!fs||!fs.length) return;
  e.preventDefault();
  _dragDepth=0; document.body.classList.remove('drag-over');
  if(view!=='exams'){ view='exams'; render(); }
  handleFiles(Array.prototype.slice.call(fs));
});

document.addEventListener('keydown',function(e){
  if(spell){
    if(e.key==='Escape'){spell=null;closeLayer();render();return;}
    if(e.key==='Enter'){
      e.preventDefault();
      if(spell.checked) spellNext(); else spellCheck();
      return;
    }
  }
  if(e.key==='Enter'&&e.target.id==='dictSearch'){doAct('addword');return;}
  if(qz){
    if(e.key==='Escape'){qz=null;closeLayer();render();return;}
    if(e.key==='Enter'){e.preventDefault();if(qz.checked)qNext();else qSubmit();return;}
    return;
  }
  if(!review)return;
  if(e.code==='Space'){e.preventDefault();if(!review.shown){review.shown=true;drawReview();}return;}
  if(e.key==='Escape'){closeLayer();render();return;}
  if(!review.shown)return;
  const map={'1':1,'2':1,'3':2,'4':3};
  if(map[e.key]){
    const x=review.list[review.i];
    S.lv[x.id]=map[e.key];if(map[e.key]===3)S.star[x.id]=true;
    review.i++;review.shown=false;save();drawReview();
  }
});

/* 造一张写着「HELLO OCR 2026」的图，用来验证浏览器内置识别真的能出字 */
function makeOcrTestImage(){
  const c=document.createElement('canvas');
  c.width=620;c.height=150;
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,620,150);
  g.fillStyle='#000';g.font='bold 46px Arial';g.textBaseline='middle';
  g.fillText('HELLO OCR 2026',28,76);
  return c.toDataURL('image/png');
}
async function testBrowserOcr(){
  const el=document.getElementById('ocrBState');
  const set=function(t,c){ if(el){el.textContent=t;el.style.color=c||'var(--mut)';} };
  set('加载引擎中…');
  toast('首次测试要下载约 9MB 识别模型，请稍候…');
  try{
    const t=await ocrBrowser(makeOcrTestImage(),function(m){ set(String(m).slice(0,34)); });
    const ok=/HELLO/i.test(t)&&/OCR/i.test(t);
    set(ok?'✓ 可用 · 自测「'+String(t).replace(/\s+/g,' ').trim().slice(0,18)+'」':'✗ 结果异常',ok?'#2E7D45':'#B8442F');
    toast(ok?'✓ 浏览器内置识别可用，换任何设备打开都能用':('自测结果：'+(t||'').slice(0,40)));
  }catch(e){
    set('✗ '+String(e.message||'').slice(0,42),'#B8442F');
    toast(e.message||'内置识别不可用');
  }
}
async function testOcr(){
  const el=document.getElementById('ocrState');
  if(el){el.textContent='检测中…';el.style.color='var(--mut)';}
  const url=ocrBase();
  try{
    _ocrCap=null;
    const cap=await ocrCap();          /* 先验明正身：不是真 Umi-OCR 直接抛错 */
    const j=(cap&&cap.raw)||{};
    const n=Object.keys(j).length;
    const opt=buildOcrOptions(cap);    /* 翻译成当前引擎真正认识的参数 */
    const lang=opt['ocr.language']||'—（该引擎不支持切换语言）';
    const sideKey=opt['ocr.maxSideLen']!==undefined?'ocr.maxSideLen'
                 :(opt['ocr.limit_side_len']!==undefined?'ocr.limit_side_len':'');
    const side=sideKey?opt[sideKey]:'—（该引擎不支持）';
    const angKey=opt['ocr.angle']!==undefined?'ocr.angle':(opt['ocr.cls']!==undefined?'ocr.cls':'');
    const ang=angKey?(opt[angKey]?'开':'关'):'—';
    if(el){
      el.textContent='✓ 真的 Umi-OCR · 语言 '+lang+' · 精度 '+side+' · 纠向 '+ang;
      el.style.color='#2E7D45';
      el.title='引擎返回 '+n+' 个参数；实际下发：'+JSON.stringify(opt);
    }
    toast('✓ 已连上 · 语言 '+lang+'，精度 '+side);
  }catch(e){
    if(el){el.textContent='未连接 · '+String(e.message||'').slice(0,46);el.style.color='#B8442F';}
    toast(e.message||('连不上 '+url));
  }
}

function applySet(){
  document.documentElement.style.setProperty('--fs',(S.set.fs/100*15)+'px');
  const f=S.set.font;
  document.body.style.fontFamily = f==='serif'?'Georgia,"Times New Roman","Songti SC",serif'
    : f==='hand'?'var(--hand)':'var(--sans)';
}

/* ---------- 启动 ---------- */
if(window.speechSynthesis){
  refreshVoices();
  speechSynthesis.onvoiceschanged=function(){refreshVoices();};
}
applySet();
render();
